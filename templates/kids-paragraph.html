<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --kid-bg: #F4FBF6;
    --kid-ink: #24303A;
    --kid-green: #4CAF6D;
    --kid-blue: #4FA8D8;
    --kid-yellow: #FFC94A;
    --kid-coral: #FF6F59;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    background: var(--kid-bg);
    font-family: "Noto Sans TC", sans-serif;
    color: var(--kid-ink);
    overflow: hidden;
  }
  .dot {
    position: absolute;
    border-radius: 50%;
    opacity: 0.5;
  }
  .dot.d1 { width: 30px; height: 30px; background: var(--kid-yellow); top: 8px; left: 96px; }
  .dot.d2 { width: 22px; height: 22px; background: var(--kid-coral); top: 14px; right: 140px; }
  .dot.d3 { width: 26px; height: 26px; background: var(--kid-blue); bottom: 10px; left: 160px; }
  .dot.d4 { width: 18px; height: 18px; background: var(--kid-green); bottom: 14px; right: 110px; }
  .frame {
    position: absolute;
    inset: 40px;
    border: 10px solid var(--kid-green);
    border-radius: 48px;
    padding: 48px 64px;
    display: flex;
    flex-direction: column;
    background: var(--kid-bg);
  }
  .content-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    text-align: center;
  }
  .eyebrow {
    display: inline-block;
    background: var(--kid-yellow);
    color: var(--kid-ink);
    border-radius: 999px;
    padding: 10px 30px;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 1px;
  }
  .title {
    font-weight: 900;
    font-size: 46px;
    line-height: 1.35;
    color: var(--kid-green);
  }
  .illustration svg {
    width: 400px;
    height: auto;
    display: block;
  }
  .body-text {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 820px;
  }
  .body-text p {
    font-size: 24px;
    font-weight: 600;
    line-height: 1.7;
    color: var(--kid-ink);
  }
  footer {
    text-align: center;
    border-top: 3px dashed var(--kid-blue);
    padding-top: 20px;
  }
  .brand {
    font-size: 20px;
    font-weight: 900;
    color: var(--kid-coral);
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="dot d1"></div>
  <div class="dot d2"></div>
  <div class="dot d3"></div>
  <div class="dot d4"></div>
  <div class="frame">
    <div class="content-wrap">
      <div class="eyebrow">{{eyebrow}}</div>
      <h1 class="title">{{title}}</h1>
      <div class="illustration">{{{illustration}}}</div>
      <div class="body-text">
        {{#paragraphs}}
        <p>{{.}}</p>
        {{/paragraphs}}
      </div>
    </div>
    <footer>
      <span class="brand">&#9733; {{brand}}</span>
    </footer>
  </div>
</body>
</html>
