<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #23211D;
    --ink-soft: rgba(35,33,29,0.62);
    --cream: #F7F2E9;
    --rust: #C05B3F;
    --sage: #6F7F5D;
    --line: rgba(35,33,29,0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    background: var(--cream);
    font-family: "Noto Sans TC", sans-serif;
    color: var(--ink);
    overflow: hidden;
  }
  .frame {
    position: absolute;
    inset: 56px;
    border: 1px solid var(--line);
    padding: 56px 64px;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .eyebrow {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--rust);
  }
  .series {
    font-size: 15px;
    color: var(--ink-soft);
    letter-spacing: 2px;
  }
  .title {
    font-family: "Noto Serif TC", serif;
    font-weight: 900;
    font-size: 48px;
    line-height: 1.3;
    margin-top: 22px;
  }
  .rule {
    width: 64px;
    height: 3px;
    background: var(--rust);
    margin: 30px 0;
  }
  .content-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
  }
  .illustration {
    text-align: center;
  }
  .illustration svg {
    width: 300px;
    height: auto;
    display: inline-block;
  }
  .body-text {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .body-text p {
    font-size: 21px;
    line-height: 1.9;
    color: var(--ink);
  }
  .body-text p:first-of-type::first-letter {
    font-family: "Noto Serif TC", serif;
    font-weight: 900;
    font-size: 64px;
    color: var(--rust);
    float: left;
    line-height: 1;
    padding-right: 12px;
    padding-top: 6px;
  }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--line);
    padding-top: 20px;
  }
  .brand {
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .mark-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--sage);
  }
</style>
</head>
<body>
  <div class="frame">
    <header>
      <div class="eyebrow">{{eyebrow}}</div>
      <div class="series">{{series}}</div>
    </header>
    <h1 class="title">{{title}}</h1>
    <div class="rule"></div>
    <div class="content-wrap">
      {{#illustration}}<div class="illustration">{{{illustration}}}</div>{{/illustration}}
      <div class="body-text">
        {{#paragraphs}}
        <p>{{.}}</p>
        {{/paragraphs}}
      </div>
    </div>
    <footer>
      <span class="brand">{{brand}}</span>
      <span class="mark-dot"></span>
    </footer>
  </div>
</body>
</html>
