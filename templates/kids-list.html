<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --kid-bg: #F4FBF6;
    --kid-ink: #24303A;
    --kid-green: #4CAF6D;
    --kid-blue: #4FA8D8;
    --kid-yellow: #FFC94A;
    --kid-coral: #FF6F59;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    background: var(--kid-bg);
    font-family: "Noto Sans TC", sans-serif;
    color: var(--kid-ink);
    overflow: hidden;
  }
  .dot {
    position: absolute;
    border-radius: 50%;
    opacity: 0.5;
  }
  .dot.d1 { width: 30px; height: 30px; background: var(--kid-yellow); top: 8px; left: 96px; }
  .dot.d2 { width: 22px; height: 22px; background: var(--kid-coral); top: 14px; right: 140px; }
  .dot.d3 { width: 26px; height: 26px; background: var(--kid-blue); bottom: 10px; left: 160px; }
  .dot.d4 { width: 18px; height: 18px; background: var(--kid-green); bottom: 14px; right: 110px; }
  .frame {
    position: absolute;
    inset: 40px;
    border: 10px solid var(--kid-green);
    border-radius: 48px;
    padding: 44px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--kid-bg);
  }
  .eyebrow {
    display: inline-block;
    background: var(--kid-yellow);
    color: var(--kid-ink);
    border-radius: 999px;
    padding: 10px 30px;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }
  .title {
    width: 100%;
    text-align: center;
    font-weight: 900;
    font-size: 44px;
    line-height: 1.3;
    color: var(--kid-green);
    margin-bottom: 16px;
  }
  .illustration {
    margin-bottom: 12px;
  }
  .illustration svg {
    width: 210px;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .points {
    list-style: none;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .points li {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .bubble {
    flex: 0 0 auto;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 26px;
    color: #ffffff;
  }
  .bubble-yellow { background: var(--kid-yellow); color: var(--kid-ink); }
  .bubble-blue { background: var(--kid-blue); }
  .bubble-coral { background: var(--kid-coral); }
  .bubble-green { background: var(--kid-green); }
  .points h2 {
    font-size: 26px;
    font-weight: 900;
    color: var(--kid-ink);
    margin-bottom: 4px;
  }
  .points p {
    font-size: 20px;
    font-weight: 500;
    color: var(--kid-ink);
    opacity: 0.8;
    line-height: 1.5;
  }
  footer {
    width: 100%;
    text-align: center;
    border-top: 3px dashed var(--kid-blue);
    padding-top: 18px;
    margin-top: 16px;
  }
  .brand {
    font-size: 20px;
    font-weight: 900;
    color: var(--kid-coral);
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="dot d1"></div>
  <div class="dot d2"></div>
  <div class="dot d3"></div>
  <div class="dot d4"></div>
  <div class="frame">
    <div class="eyebrow">{{eyebrow}}</div>
    <h1 class="title">{{title}}</h1>
    <div class="illustration">{{{illustration}}}</div>
    <ol class="points">
      {{#points}}
      <li>
        <span class="bubble bubble-{{color}}">{{index}}</span>
        <div class="text">
          <h2>{{heading}}</h2>
          <p>{{body}}</p>
        </div>
      </li>
      {{/points}}
    </ol>
    <footer>
      <span class="brand">&#9733; {{brand}}</span>
    </footer>
  </div>
</body>
</html>
