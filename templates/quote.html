<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #23211D;
    --ink-soft: rgba(35,33,29,0.62);
    --cream: #F7F2E9;
    --rust: #C05B3F;
    --sage: #6F7F5D;
    --line: rgba(35,33,29,0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    background: var(--cream);
    font-family: "Noto Sans TC", sans-serif;
    color: var(--ink);
    overflow: hidden;
  }
  .frame {
    position: absolute;
    inset: 56px;
    border: 1px solid var(--line);
    padding: 56px 72px;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .eyebrow {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--rust);
  }
  .series {
    font-size: 15px;
    color: var(--ink-soft);
    letter-spacing: 2px;
  }
  .mark {
    position: absolute;
    top: 108px;
    left: 60px;
    font-family: "Noto Serif TC", serif;
    font-weight: 900;
    font-size: 220px;
    line-height: 1;
    color: var(--rust);
    opacity: 0.14;
    user-select: none;
  }
  .quote-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .quote {
    font-family: "Noto Serif TC", serif;
    font-weight: 700;
    font-size: 46px;
    line-height: 1.55;
    position: relative;
    z-index: 1;
  }
  .rule {
    width: 56px;
    height: 3px;
    background: var(--sage);
    margin: 36px 0 22px;
  }
  .author {
    font-size: 17px;
    letter-spacing: 2px;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--line);
    padding-top: 20px;
  }
  .brand {
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .mark-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--rust);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="mark">&ldquo;</div>
    <header>
      <div class="eyebrow">{{eyebrow}}</div>
      <div class="series">{{series}}</div>
    </header>
    <div class="quote-wrap">
      <p class="quote">{{quote}}</p>
      <div class="rule"></div>
      <p class="author">&mdash; {{author}}</p>
    </div>
    <footer>
      <span class="brand">{{brand}}</span>
      <span class="mark-dot"></span>
    </footer>
  </div>
</body>
</html>
